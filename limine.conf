timeout: 0
serial: yes

# Three boot entries (default: normal). The cmdline flags are read by
# the kernel (cmdline_has) - see docs/REAL_HARDWARE.md.
/Vesper (normal)
    protocol: limine
    path: boot():/vesper.elf
    cmdline:

/Vesper (diagnostics hold)
    protocol: limine
    path: boot():/vesper.elf
    cmdline: diagnostics_hold

/Vesper (quiet)
    protocol: limine
    path: boot():/vesper.elf
    cmdline: quiet
